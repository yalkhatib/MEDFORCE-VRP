# Bases de développement : PostgreSQL 16 et SQL Server 2022 (au choix via DB_TYPE).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: medforce, POSTGRES_PASSWORD: medforce, POSTGRES_DB: medforce_vrp }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Medforce_2026!", MSSQL_PID: Developer }
    ports: ["1433:1433"]
    volumes: [mssqldata:/var/opt/mssql]
volumes:
  pgdata:
  mssqldata:
